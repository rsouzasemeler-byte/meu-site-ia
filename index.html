<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Chat</title>
</head>

<body>

<h2>Chat simples</h2>

<input id="pergunta" placeholder="Digite...">
<button onclick="enviar()">Enviar</button>

<div id="chat"></div>

<script>
async function enviar() {
  let texto = document.getElementById("pergunta").value;

  if (!texto) return;

  try {
    let resposta = await fetch("https://a817a348-3c3c-42b3-8f0c-112fe806e5f9-00-37gnswhqza25z.riker.replit.dev/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ mensagem: texto })
    });

    let dados = await resposta.json();

    document.getElementById("chat").innerHTML += "<p><b>Você:</b> " + texto + "</p>";
    document.getElementById("chat").innerHTML += "<p><b>Bot:</b> " + dados.resposta + "</p>";

  } catch (e) {
    document.getElementById("chat").innerHTML += "<p>ERRO DE CONEXÃO</p>";
  }
}
</script>

</body>
</html>
